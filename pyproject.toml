[project]
name = "sankofaguard"
version = "0.1.1"
description = "Unicode covert-channel normalization preprocessor for LLM/MT pipelines (defensive code only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sankofaguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
