[project]
name = "sankofaguard"
version = "0.1.1"
description = "Unicode covert-channel normalization preprocessor for LLM/MT pipelines (defensive code only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SankofaGuard contributors" }]
keywords = [
    "llm-security", "prompt-injection", "unicode", "normalization",
    "jailbreak-defense", "guardrail", "low-resource-languages",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# The normalizer itself is stdlib-only. Service dependencies are optional extras.
dependencies = []

[project.optional-dependencies]
service = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/jayluxferro/sankofaguard"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sankofaguard"]

[tool.setuptools.package-data]
sankofaguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
